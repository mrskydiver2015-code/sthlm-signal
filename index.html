<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>STHLM SIGNAL — Blåtimmen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#0a1a36; --panel:rgba(10,17,34,.78); --panel2:rgba(14,23,44,.92);
  --line:rgba(210,225,255,.12); --text:#eef3fb; --dim:#9fb0cc;
  --brass:#d9aa63; --blue:#7fa8e0; --danger:#e07a7a;
  --r:18px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--text);
  font-family:Inter,system-ui,sans-serif;font-size:15px;overscroll-behavior:none;}
button{touch-action:manipulation;}
#scene{position:fixed;inset:0;display:block;touch-action:none;}
h1,h2,h3,.disp{font-family:'Space Grotesk',Inter,sans-serif;letter-spacing:.04em;}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;color:var(--text);
  background:rgba(255,255,255,.08);padding:10px 16px;font-size:14px;font-weight:500;
  transition:background .15s, transform .1s;}
button:hover{background:rgba(255,255,255,.15);}
button:active{transform:scale(.97);}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
button.primary{background:var(--brass);color:#1a1206;font-weight:600;}
button.primary:hover{background:#e8bd7c;}
button.ghost{background:transparent;border:1px solid var(--line);}
input[type=text],input[type=email]{background:rgba(255,255,255,.06);border:1px solid var(--line);
  border-radius:12px;color:var(--text);padding:11px 14px;font-size:15px;width:100%;font-family:inherit;}
input:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:transparent;}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:40;
  padding:18px;background:rgba(4,9,20,.45);backdrop-filter:blur(6px);}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);
  padding:26px 26px 22px;max-width:460px;width:100%;max-height:88vh;overflow-y:auto;
  box-shadow:0 24px 80px rgba(0,0,0,.5);}
.card h2{margin:0 0 4px;font-size:21px;font-weight:700;}
.card .sub{color:var(--dim);font-size:13.5px;margin:0 0 18px;line-height:1.5;}
.eyebrow{font-family:'Space Grotesk';font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--brass);margin-bottom:8px;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.grow{flex:1;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px;}
.chip{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13.5px;
  background:rgba(255,255,255,.04);display:flex;align-items:center;gap:7px;}
.chip svg{flex:none;}
.chip.on{border-color:var(--chipc,var(--brass));background:color-mix(in srgb,var(--chipc,var(--brass)) 18%, transparent);}
.chip.sig.on{box-shadow:0 0 0 1px var(--chipc);}
.styleCards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0;}
.styleCard{border:1px solid var(--line);border-radius:14px;padding:12px 8px 10px;background:rgba(255,255,255,.03);
  display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);}
.styleCard.on{border-color:var(--brass);background:rgba(217,170,99,.1);color:var(--text);}
.styleCard canvas{border-radius:10px;}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px;}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0;}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.3);}
label.f{display:block;font-size:12.5px;color:var(--dim);margin:14px 0 6px;letter-spacing:.03em;}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:20;}
#hud .hbtn{pointer-events:auto;width:44px;height:44px;border-radius:14px;display:flex;
  align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(8px);padding:0;}
#hudTop{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;display:flex;gap:8px;}
#logoTag{position:absolute;top:calc(14px + env(safe-area-inset-top));left:16px;
  font-family:'Space Grotesk';font-size:13px;letter-spacing:.28em;color:rgba(238,243,251,.85);
  text-shadow:0 2px 12px rgba(0,0,0,.6);user-select:none;}
#logoTag b{color:var(--brass);}
#sigNow{position:absolute;top:calc(58px + env(safe-area-inset-top));left:16px;display:flex;align-items:center;gap:8px;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;
  font-size:12.5px;pointer-events:auto;backdrop-filter:blur(8px);cursor:pointer;color:var(--text);}
#prompt{position:absolute;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);
  display:none;flex-direction:column;align-items:center;gap:10px;pointer-events:auto;}
#prompt .ptitle{background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:8px 18px;font-size:13.5px;backdrop-filter:blur(8px);text-align:center;}
#prompt .pbtns{display:flex;gap:8px;}
#prompt button{backdrop-filter:blur(8px);background:var(--panel);border:1px solid var(--line);}
#prompt button.primary{background:var(--brass);border-color:transparent;}
#toast{position:absolute;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);
  background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px 20px;
  font-size:13.5px;opacity:0;transition:opacity .3s;max-width:86vw;text-align:center;line-height:1.45;}
#fade{position:fixed;inset:0;background:#04070f;z-index:60;opacity:1;transition:opacity 1.1s ease;pointer-events:none;}
#vig{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(3,7,16,.55) 100%);}
/* intro */
#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;padding-bottom:12vh;pointer-events:none;}
#intro .title{font-family:'Space Grotesk';font-weight:700;font-size:clamp(34px,7vw,64px);
  letter-spacing:.3em;text-indent:.3em;color:#fff;text-shadow:0 4px 40px rgba(10,26,54,.9);
  opacity:0;transition:opacity 2s;}
#intro .sub2{font-size:clamp(13px,2vw,15px);letter-spacing:.42em;text-indent:.42em;color:var(--brass);
  margin-top:10px;opacity:0;transition:opacity 2s .6s;font-family:'Space Grotesk';}
#skipBtn{pointer-events:auto;margin-top:34px;opacity:0;transition:opacity 1s 1.5s;
  background:rgba(10,17,34,.6);border:1px solid var(--line);backdrop-filter:blur(6px);}
#intro.show .title,#intro.show .sub2,#intro.show #skipBtn{opacity:1;}
/* touch controls */
#joyZone{position:fixed;left:0;bottom:0;width:46vw;height:44vh;z-index:15;display:none;touch-action:none;}
#joyBase{position:absolute;width:110px;height:110px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.05);display:none;}
#joyKnob{position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.35);display:none;}
#lookZone{position:fixed;right:0;bottom:0;width:54vw;height:60vh;z-index:14;display:none;touch-action:none;}
/* profile card */
.pcHead{display:flex;gap:14px;align-items:center;margin-bottom:14px;}
.pcHead img,.pcHead canvas{width:64px;height:64px;border-radius:18px;}
.badgeDemo{font-size:10.5px;letter-spacing:.14em;background:rgba(127,168,224,.18);color:var(--blue);
  border:1px solid rgba(127,168,224,.4);border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:2px;}
.shared{background:rgba(217,170,99,.14);border:1px solid rgba(217,170,99,.45);border-radius:12px;
  padding:10px 14px;font-size:13.5px;margin:12px 0;display:flex;gap:8px;align-items:center;}
.sigline{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--dim);margin:4px 0 8px;}
hr.s{border:none;border-top:1px solid var(--line);margin:16px 0;}
.helpk{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13.5px;margin-top:12px;}
.helpk b{font-family:'Space Grotesk';background:rgba(255,255,255,.08);border-radius:7px;
  padding:2px 9px;font-weight:500;text-align:center;font-size:12px;}
.artvisual{width:100%;height:120px;border-radius:12px;margin:10px 0;}
@media (max-width:600px){ .card{padding:20px 18px 16px;} }

#travelBar{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto;background:var(--panel2);padding:5px;border:1px solid var(--line);border-radius:16px;white-space:nowrap;}
#travelBar button{padding:10px 13px;min-height:44px;font-size:12px;}
#travelBar button[aria-pressed=true]{background:var(--brass);color:#1a1206;}
#wayfinding{position:absolute;top:100px;left:16px;max-width:calc(100vw - 32px);display:flex;flex-direction:column;align-items:flex-start;gap:5px;}
#locationName,#discoveries{font-size:11px;letter-spacing:.07em;color:var(--dim);text-shadow:0 1px 4px #000;}
#guideToggle{pointer-events:auto;background:var(--panel);border:1px solid var(--line);padding:8px 10px;font-size:12px;}
.chatter{margin:20px 0;padding-left:16px;border-left:2px solid var(--brass);line-height:1.8;color:#f2e5ce;}
.exhibitPreview{height:150px;border-radius:12px;background:radial-gradient(ellipse at center,#354b54,#0b151d);display:flex;align-items:center;justify-content:center;margin:16px 0;overflow:hidden;}
.objectPreview{display:block;background:var(--exhibit);box-shadow:inset -12px 0 18px #0005,0 12px 24px #0008;}
.objectPreview.vase{width:64px;height:95px;border-radius:18% 18% 38% 38%;transform:perspective(160px) rotateY(-20deg);}
.objectPreview.lamp{width:100px;height:60px;border-radius:55% 55% 10% 10%;border-bottom:8px solid #ffe4a0;box-shadow:0 20px 50px var(--exhibit);}
.objectPreview.book{width:75px;height:105px;transform:rotate(-15deg);border-left:7px solid #0005;border-bottom:6px solid #eadcc6;}
.objectPreview.record{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,#ecdcbc 3%,var(--exhibit) 4%,var(--exhibit) 20%,#17202b 21%,#080f18 65%,#344151);}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vig"></div>

<div id="hud">
  <div id="logoTag">STHLM <b>SIGNAL</b></div>
  <button id="sigNow" title="Byt aktiv signal"></button>
  <div id="hudTop">
    <button class="hbtn" id="btnHelp" title="Hjälp (H)" aria-label="Hjälp">?</button>
    <button class="hbtn" id="btnMute" title="Ljud av/på (M)" aria-label="Ljud">♪</button>
    <button class="hbtn" id="btnReset" title="Återställ position (R)" aria-label="Återställ">⟲</button>
    <button class="hbtn" id="btnExit" title="Till gatan" style="display:none" aria-label="Till gatan">⤴</button>
  </div>
  <div id="wayfinding"><span id="locationName">Norrmalmstorg</span><button id="guideToggle" title="Byt mål"><span id="guideText">↑ Sturegallerian</span></button><span id="discoveries">0/5 upptäckter</span></div>
  <div id="travelBar" role="group" aria-label="Rörelsehastighet"><button data-speed="1" aria-pressed="true">1× Gå</button><button data-speed="2" aria-pressed="false">2× Spring</button><button data-speed="4" aria-pressed="false">4× Snabbt</button></div>
  <div id="prompt">
    <div class="ptitle" id="promptTitle"></div>
    <div class="pbtns" id="promptBtns"></div>
  </div>
  <div id="toast"></div>
</div>

<div id="joyZone"><div id="joyBase"></div><div id="joyKnob"></div></div>
<div id="lookZone"></div>

<div id="intro">
  <div class="title">STHLM SIGNAL</div>
  <div class="sub2">BLÅTIMMEN · KAPITEL ETT</div>
  <button id="skipBtn">Hoppa över</button>
</div>

<div id="uiRoot"></div>
<div id="fade"></div>

<script src="config.js"></script>
<script src="vendor/three.min.js"></script>
<script src="urban.js"></script>
<script src="input-manager.js"></script>
<script>
"use strict";
/* ============================================================
   STHLM SIGNAL — Blåtimmen. Kapitel ett.
   En spelbar vertikal skiva av Stockholm:
   Norrmalmstorg → Biblioteksgatan → Stureplan → Sturegallerian.
   ============================================================ */

/* ---------- DATA ---------- */
const SIGNALS = [
  {id:'golf',  label:'Golf',                color:'#4f8fe8', icon:'flag'},
  {id:'food',  label:'Mat & matlagning',    color:'#5fb96a', icon:'fork'},
  {id:'sport', label:'Sport',               color:'#e05a5a', icon:'bolt'},
  {id:'art',   label:'Konst & design',      color:'#a06ae0', icon:'palette'},
  {id:'tech',  label:'AI & teknik',         color:'#3ec6c6', icon:'chip'},
  {id:'music', label:'Musik & evenemang',   color:'#e8944f', icon:'note'},
  {id:'walk',  label:'Promenad & upptäckt', color:'#e9edf4', icon:'compass'},
  {id:'open',  label:'Öppen för nya möten', color:'#e8c94f', icon:'meet'},
  {id:'nature',label:'Natur & fiske',       color:'#2e8f63', icon:'leaf'},
];
function sig(id){ return SIGNALS.find(s=>s.id===id) || customSig(id); }
function customSig(id){
  const p = state.profile;
  if (p && p.customs) { const c = p.customs.find(c=>c.id===id); if(c) return c; }
  for (const d of DEMOS){ if(d.customs){ const c=d.customs.find(c=>c.id===id); if(c) return c; } }
  return {id, label:id, color:'#d66aa8', icon:'spark'};
}
const AV_STYLES = [
  {id:'norrmalm', label:'Norrmalm', desc:'Lång skräddad rock',  coat:'#3a4356', coatLen:'long', hair:'short'},
  {id:'soeder',   label:'Söder',    desc:'Jacka och keps',      coat:'#5a4a3c', coatLen:'short', hair:'cap'},
  {id:'atelje',   label:'Ateljé',   desc:'Oversize och konstnärlig', coat:'#6b4a5e', coatLen:'wide', hair:'long'},
];
const ACCENTS = ['#d9aa63','#7fa8e0','#c96a6a','#6fbf8f','#b58ae0','#e0b84f','#5fc4c4','#e88fb0'];
const SKINS = ['#e8c4a0','#c99b73','#9c6f4e','#6e4a33'];
const DEMOS = [
  {id:'vera', name:'Vera Lind', demo:true, signal:'art', interests:['art','music','walk'],
   style:'atelje', accent:'#b58ae0', skin:1, pos:[5.3,0,56], face:Math.PI, area:'out',
   bio:'Curator. Letar alltid efter nästa ljusinstallation.'},
  {id:'jonas', name:'Jonas Berg', demo:true, signal:'golf', interests:['golf','sport','food'],
   style:'norrmalm', accent:'#7fa8e0', skin:0, pos:[9,0,-16], face:-1.2, area:'out',
   bio:'Handikapp 12 och envis optimist.'},
  {id:'amira', name:'Amira Khan', demo:true, signal:'tech', interests:['tech','music','open'],
   style:'soeder', accent:'#5fc4c4', skin:2, pos:[3.2,0,182.5], face:2.4, area:'out',
   bio:'Bygger saker med språkmodeller. Gillar Svampen som kontor.'},
  {id:'elias', name:'Elias Ström', demo:true, signal:'food', interests:['food','nature'],
   style:'norrmalm', accent:'#6fbf8f', skin:0, pos:[487,0,206], face:-.8, area:'in',
   bio:'Kock på jakt efter höstens bästa kantareller.'},
];
const GALLERY = [
  {id:'fable', title:'Fable Sphere', tag:'Cylinder av berättelser',
   desc:'En rumslig arbetsyta där du står inne i en cylinder och sveper genom världar av innehåll. Ett av Patriks pågående digitala projekt — här som ljusskulptur.', hue:210},
  {id:'konst', title:'Konstellation', tag:'Tal, rytm, mönster',
   desc:'En utforskare av numerologi och biorytmer. Installationen andas i din egen takt.', hue:280},
  {id:'memory', title:'Memory Library', tag:'Ett bibliotek du kan gå in i',
   desc:'Minnen som rum. En 3D-prototyp där varje hylla är ett kapitel av ett liv.', hue:40},
  {id:'tab', title:'Tab', tag:'Delade ögonblick, delade notor',
   desc:'Vardagens ekonomi som mönster av ljus — vem bjöd på kaffet i tisdags?', hue:150},
  {id:'brief', title:'My News Brief', tag:'Text-TV, återfödd',
   desc:'Dagens Sverige i ren text. En hyllning till skärmar som lyste i vardagsrum.', hue:0},
];

/* ---------- STATE ---------- */
const config = window.STHLM_CONFIG || {};
function escapeHTML(value){
  return String(value).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const state = {
  profile:null, inside:false, playing:false, intro:true,
  muted:false, connections:[], waved:{},
  mobile: matchMedia('(any-pointer:coarse)').matches,
};
function defaultProfile(){
  return { name:'', style:'norrmalm', accent:ACCENTS[0], skin:0,
    interests:['walk'], customs:[], signal:'walk', visibility:'all', account:'guest' };
}
function saveProfile(){ try{ localStorage.setItem('sthlmSignalProfile',
  JSON.stringify({p:state.profile, c:state.connections})); }catch(e){} }
function loadProfile(){ try{
  const raw = localStorage.getItem('sthlmSignalProfile'); if(!raw) return false;
  const d = JSON.parse(raw); state.profile = Object.assign(defaultProfile(), d.p);
  state.connections = d.c||[]; return !!state.profile.name;
}catch(e){ return false; } }

/* ---------- ICONS (canvas + inline svg) ---------- */
function drawIcon(ctx, type, cx, cy, s, color){
  ctx.save(); ctx.translate(cx,cy); ctx.strokeStyle=color; ctx.fillStyle=color;
  ctx.lineWidth=s*.14; ctx.lineCap='round'; ctx.lineJoin='round';
  const u=s/2;
  switch(type){
    case 'flag':
      ctx.beginPath(); ctx.moveTo(-u*.5,u); ctx.lineTo(-u*.5,-u); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-u*.5,-u); ctx.lineTo(u*.7,-u*.55); ctx.lineTo(-u*.5,-u*.1);
      ctx.closePath(); ctx.fill(); break;
    case 'fork':
      for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(i*u*.42,-u); ctx.lineTo(i*u*.42,-u*.2); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(0,-u*.15); ctx.lineTo(0,u); ctx.stroke(); break;
    case 'bolt':
      ctx.beginPath(); ctx.moveTo(u*.25,-u); ctx.lineTo(-u*.45,u*.15); ctx.lineTo(u*.02,u*.15);
      ctx.lineTo(-u*.25,u); ctx.lineTo(u*.45,-u*.12); ctx.lineTo(0,-u*.12); ctx.closePath(); ctx.fill(); break;
    case 'palette':
      ctx.beginPath(); ctx.arc(0,0,u*.85,.5,Math.PI*2-.5); ctx.stroke();
      [[-.35,-.35],[.35,-.35],[0,.4]].forEach(p=>{ctx.beginPath();ctx.arc(p[0]*u,p[1]*u,u*.16,0,7);ctx.fill();});
      break;
    case 'chip':
      ctx.strokeRect(-u*.55,-u*.55,u*1.1,u*1.1);
      for(let i=-1;i<=1;i+=2){ for(let j=-1;j<=1;j+=1){
        ctx.beginPath(); ctx.moveTo(i*u*.55,j*u*.35); ctx.lineTo(i*u*.95,j*u*.35); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(j*u*.35,i*u*.55); ctx.lineTo(j*u*.35,i*u*.95); ctx.stroke(); }}
      break;
    case 'note':
      ctx.beginPath(); ctx.ellipse(-u*.3,u*.55,u*.32,u*.24,-.4,0,7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0,u*.5); ctx.lineTo(0,-u*.8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,-u*.8); ctx.quadraticCurveTo(u*.6,-u*.6,u*.55,-u*.1); ctx.stroke(); break;
    case 'compass':
      ctx.beginPath(); ctx.moveTo(0,-u); ctx.lineTo(u*.28,0); ctx.lineTo(0,u); ctx.lineTo(-u*.28,0);
      ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.arc(0,0,u*.95,0,7); ctx.stroke(); break;
    case 'meet':
      ctx.beginPath(); ctx.arc(-u*.4,-u*.35,u*.3,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(u*.4,-u*.35,u*.3,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(-u*.4,u*.75,u*.55,Math.PI,0); ctx.fill();
      ctx.beginPath(); ctx.arc(u*.4,u*.75,u*.55,Math.PI,0); ctx.fill(); break;
    case 'leaf':
      ctx.beginPath(); ctx.moveTo(0,u); ctx.quadraticCurveTo(-u*.95,u*.1,0,-u);
      ctx.quadraticCurveTo(u*.95,u*.1,0,u); ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.moveTo(0,u*.8); ctx.lineTo(0,-u*.7); ctx.stroke(); break;
    default: /* spark */
      ctx.beginPath();
      for(let i=0;i<8;i++){ const a=i*Math.PI/4, r=(i%2?u*.4:u); ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r); }
      ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function iconSVG(type,color,size=16){
  const c = document.createElement('canvas'); c.width=c.height=48;
  const x=c.getContext('2d'); drawIcon(x,type,24,24,30,color);
  const img=document.createElement('img'); img.src=c.toDataURL(); img.width=size; img.height=size;
  img.style.verticalAlign='middle'; return img.outerHTML.replace('<img','<img alt=""');
}
function portrait(name, accent, size=128){
  const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,size,size); g.addColorStop(0,accent); g.addColorStop(1,'#12203c');
  x.fillStyle=g; x.fillRect(0,0,size,size);
  x.fillStyle='rgba(255,255,255,.92)'; x.font=`600 ${size*.4}px 'Space Grotesk',sans-serif`;

/* facade textures: diffuse + emissive (lit windows) */
function facadeTex(wm, hm, palette, litProb=.42){
  const px=Math.min(26,(state.mobile?256:512)/Math.max(wm,hm)); const W=Math.max(64,Math.round(wm*px)), H=Math.max(64,Math.round(hm*px));
  const d=document.createElement('canvas'); d.width=W; d.height=H; const dx=d.getContext('2d');
  const e=document.createElement('canvas'); e.width=W; e.height=H; const ex=e.getContext('2d');
  dx.fillStyle=palette; dx.fillRect(0,0,W,H);
  /* subtle stone noise + floor bands */
  for(let i=0;i<W*H/120;i++){ dx.fillStyle=`rgba(${Math.random()<.5?0:255},${Math.random()<.5?0:255},255,.02)`;
    dx.fillRect(Math.random()*W, Math.random()*H, 3, 3); }
  ex.fillStyle='#000'; ex.fillRect(0,0,W,H);
  const floorH=px*3.1, winW=px*1.15, winH=px*1.7, gapX=px*1.0;
  const floors=Math.floor((hm-2)/3.1), cols=Math.floor((wm-1)/((winW+gapX)/px));
  const startY=H-px*1.2-floors*floorH;
  for(let f=0; f<floors; f++){
    const y=startY+f*floorH+px*.7;
    dx.fillStyle='rgba(255,255,255,.05)'; dx.fillRect(0, startY+f*floorH-2, W, 2);
    for(let cI=0;cI<cols;cI++){
      const xw=(W-cols*(winW+gapX)+gapX)/2 + cI*(winW+gapX);
      dx.fillStyle='#0b1322'; dx.fillRect(xw,y,winW,winH);
      dx.strokeStyle='rgba(230,235,245,.25)'; dx.lineWidth=2; dx.strokeRect(xw,y,winW,winH);
      dx.beginPath(); dx.moveTo(xw,y+winH/2); dx.lineTo(xw+winW,y+winH/2); dx.stroke();
      if(Math.random()<litProb && f<floors){ /* varmt fönsterljus */
        const warm=['#ffca82','#ffd9a3','#f4b76b','#e8e0c0'][Math.floor(Math.random()*4)];
        const g=ex.createLinearGradient(xw,y,xw,y+winH);
        g.addColorStop(0,warm); g.addColorStop(1,'#a86f38');
        ex.fillStyle=g; ex.fillRect(xw+1,y+1,winW-2,winH-2);
        if(Math.random()<.3){ ex.fillStyle='rgba(0,0,0,.5)';
          ex.fillRect(xw+winW*.25, y+2, winW*.14, winH-4); } /* siluett i fönstret */
      }
    }
  }
  /* butiksplan: varmt lysande skyltfönster */
  const shopH=px*2.4;
  dx.fillStyle='#0d1524'; dx.fillRect(0,H-shopH,W,shopH);
  const nShops=Math.max(1,Math.floor(wm/7));
  for(let sI=0;sI<nShops;sI++){
    const sw=W/nShops, xw=sI*sw+px*.35;
    const lit=Math.random()<.85;
    dx.fillStyle=lit?'#1a2438':'#0a101d'; dx.fillRect(xw,H-shopH+px*.3,sw-px*.7,shopH-px*.4);
    if(lit){ const g=ex.createLinearGradient(0,H-shopH,0,H);
      g.addColorStop(0,Math.random()<.7?'#ffc27a':'#bcd4ff'); g.addColorStop(1,'#523314');
      ex.fillStyle=g; ex.fillRect(xw,H-shopH+px*.3,sw-px*.7,shopH-px*.4); }
  }
  const mt=new THREE.CanvasTexture(d), et=new THREE.CanvasTexture(e);
  mt.encoding=et.encoding=THREE.sRGBEncoding;
  return {map:mt, em:et};
}

function box(g, w,h,d, mat, x,y,z, ry=0){
  const m=new THREE.Mesh(sharedGeometry('Box',1,1,1), mat);
  m.scale.set(w,h,d); m.userData.batchStatic=true;
  m.castShadow=h>.3; m.receiveShadow=true;
  m.position.set(x,y,z); m.rotation.y=ry; g.add(m); return m;
}
function building(g, w,h,d, x,z, face /*'px','nx','pz','nz'*/, palette, litProb){
  const t=facadeTex(face==='px'||face==='nx'?d:w, h, palette, litProb);
  const fmat=new THREE.MeshStandardMaterial({map:t.map, roughness:.88, metalness:0, envMapIntensity:.3, emissive:0xffffff, emissiveMap:t.em, emissiveIntensity:.75});
  const side=M.pbr(palette); const roof=M.pbr('#3a3630');
  const mats=[side,side,roof,side,side,side];
  const idx={px:0,nx:1,pz:4,nz:5}[face]; mats[idx]=fmat;
  // Untextured faces share identical PBR settings. Preserve their linear colors
  // per vertex so sides and roof can use one material submission.
  const geometry=new THREE.BoxGeometry(w,h,d);
  const colors=new Float32Array(geometry.attributes.position.count*3).fill(1);
  const solid=M.pbr('#ffffff',{vertexColors:true});
  for(const group of geometry.groups){
    const material=mats[group.materialIndex];
    if(material===fmat) continue;
    for(let i=group.start;i<group.start+group.count;i++){
      const vertex=geometry.index.getX(i)*3;
      colors[vertex]=material.color.r;
      colors[vertex+1]=material.color.g;
      colors[vertex+2]=material.color.b;
    }
  }
  geometry.setAttribute('color',new THREE.BufferAttribute(colors,3));
  for(let i=0;i<mats.length;i++) if(mats[i]!==fmat)mats[i]=solid;
  const m=new THREE.Mesh(geometry, mats);
  compactMaterialGroups(m);
  m.castShadow=m.receiveShadow=true;
  m.position.set(x,h/2,z); g.add(m);
  /* roofline detaljer */
  if(Math.random()<.5) box(g, (face==='px'||face==='nx'?d:w)*.3, 1.6, 2.4, M.pbr('#4a453c'),
    x+(Math.random()-.5)*w*.3, h+.8, z+(Math.random()-.5)*d*.3);
  return m;
}

function animAvatar(avatar, dt, moving, speed, waveT){
  const p=avatar.userData.parts; if(!p) return;
  avatar.userData.ph=(avatar.userData.ph||Math.random()*7)+dt*(moving?speed*3.2:1.4);
  const ph=avatar.userData.ph;
  const amp=moving?.55:.03;
  p.legL.rotation.x=Math.sin(ph)*amp; p.legR.rotation.x=-Math.sin(ph)*amp;
  p.armL.rotation.x=-Math.sin(ph)*amp*.8; 
  if(waveT>0){ p.armR.rotation.x=0;
    p.armR.rotation.z=-2.6+Math.sin(waveT*14)*.35; }
  else { p.armR.rotation.z=-.1; p.armR.rotation.x=Math.sin(ph)*amp*.8; }
  p.head.rotation.y=Math.sin(ph*.25)*.12*(moving?0:1);
}

  let dx=e.clientX-r.left-ox, dy=e.clientY-r.top-oy;

const audio={ctx:null, master:null, pad:null, padG:null, hum:null, humG:null, inG:null, stepT:0};
function initAudio(){
  if(audio.ctx) return;
  try{
    const C=new (window.AudioContext||window.webkitAudioContext)();
    audio.ctx=C; audio.master=C.createGain(); audio.master.gain.value=state.muted?0:.9;
    audio.master.connect(C.destination);
    /* stadsbrus: filtrerat brus */
    const len=C.sampleRate*2, buf=C.createBuffer(1,len,C.sampleRate), d=buf.getChannelData(0);
    let last=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; d[i]=last*3.2; }
    const src=C.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp=C.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=320;
    audio.humG=C.createGain(); audio.humG.gain.value=.05;
    src.connect(lp).connect(audio.humG).connect(audio.master); src.start();
    /* mjuk pad som stiger mot Stureplan */
    audio.padG=C.createGain(); audio.padG.gain.value=0; audio.padG.connect(audio.master);
    [110, 164.8, 138.6, 220].forEach((f,i)=>{
      const o=C.createOscillator(); o.type='triangle'; o.frequency.value=f;
      o.detune.value=(i-1.5)*4;
      const g=C.createGain(); g.gain.value=[.012,.008,.007,.004][i];
      o.connect(g).connect(audio.padG); o.start();
    });
  }catch(e){}
}
function footstep(){
  const C=audio.ctx; if(!C||state.muted) return;
  const o=C.createBufferSource(); const len=C.sampleRate*.09;
  const b=C.createBuffer(1,len,C.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);
  o.buffer=b;
  const f=C.createBiquadFilter();
  f.type= state.inside?'highpass':'bandpass';
  f.frequency.value= state.inside? 900 : 300;
  const g=C.createGain(); g.gain.value= state.inside? .12 : .09;
  o.connect(f).connect(g).connect(audio.master); o.start();
}
function chime(shared){
  const C=audio.ctx; if(!C||state.muted) return;
  [523.25, shared?659.25:587.33].forEach((f,i)=>{
    const o=C.createOscillator(); o.type='sine'; o.frequency.value=f;
    const g=C.createGain(); g.gain.setValueAtTime(0,C.currentTime+i*.12);
    g.gain.linearRampToValueAtTime(.08,C.currentTime+i*.12+.02);
    g.gain.exponentialRampToValueAtTime(.0001,C.currentTime+i*.12+.8);
    o.connect(g).connect(audio.master); o.start(C.currentTime+i*.12); o.stop(C.currentTime+i*.12+.9);
  });
}
function toggleMute(){ state.muted=!state.muted;
  if(audio.master) audio.master.gain.linearRampToValueAtTime(state.muted?0:.9, audio.ctx.currentTime+.2);
  document.getElementById('btnMute').textContent=state.muted?'∅':'♪';
  toast(state.muted?'Ljud av':'Ljud på');
}

    vEl.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ p.visibility=c.dataset.v; render(); });
  }
  render();
  panelEl.querySelector('#obAddC').onclick=()=>{
    const v=panelEl.querySelector('#obCustom').value.trim(); if(!v) return;
    const id='c_'+v.toLowerCase().replace(/[^a-zåäö0-9]/g,'').slice(0,16);
    if(!p.customs.find(c=>c.id===id)){
      p.customs.push({id, label:v, color:'#d66aa8', icon:'spark'});
      p.interests.push(id);
    }
    panelEl.querySelector('#obCustom').value=''; render();
  };
  panelEl.querySelector('#ob3Back').onclick=()=>obStep2(editing);
  panelEl.querySelector('#ob3Go').onclick=()=>{
    if(!p.interests.length) p.interests=['walk'];
    if(!p.interests.includes(p.signal)) p.signal=p.interests[0];
    saveProfile(); closePanel();
    if(editing){ makePlayer(); refreshHUD(); toast('Profil uppdaterad'); if(!state.playing) enterCity(); }
    else enterCity();
  };
}

/* ---------- INTERAKTIONER ---------- */
let currentPrompt=null;

}
function hidePrompt(){ promptEl.style.display='none'; currentPrompt=null; }

function sharedInterests(d){
  const p=state.profile;
  return d.interests.filter(i=>p.interests.includes(i));
}
function waveAt(n){
  player.waveT=1.6; n.waveT=2.0;
  const sh=sharedInterests(n.d);
  chime(sh.length>0);
  state.waved[n.d.id]=true;
  if(sh.length) toast(`${n.d.name} vinkar tillbaka — ni delar <b>${sig(sh[0]).label.toLowerCase()}</b>!`);
  else toast(`${n.d.name} vinkar glatt tillbaka.`);
}
function openProfileCard(n){

    <div class="pcHead">

    ${sh.length?`<div class="shared">${iconSVG('spark','#d9aa63')}

    <p class="sub" style="font-size:11.5px;margin:8px 0 14px">Demonstrationsprofil som visar hur möten

    <hr class="s">

/* dörr-övergångar */
let transitioning=false;
function doorTransition(goInside,venue='sture'){goThroughDoor(goInside,venue);}

/* ---------- INTRO ---------- */
const introEl=document.getElementById('intro');
let introT=0; const INTRO_LEN=11;
document.getElementById('skipBtn').onclick=endIntro;
function endIntro(){
  if(!state.intro) return;
  state.intro=false; introEl.classList.remove('show');
  setTimeout(()=>introEl.style.display='none',800);
  const has=loadProfile();
  startOnboarding(has);
}

/* ---------- LOOP ---------- */
const clock=new THREE.Clock();
let stepAcc=0;
function tick(){
  requestAnimationFrame(tick);
  renderer.info.reset(); // One reset for the complete application frame, including shadows.
  const dt=Math.min(clock.getDelta(),.05);
  const t=clock.elapsedTime;

  /* intro-kamera */
  if(state.intro){
    introT+=dt;
    const k=Math.min(1,introT/INTRO_LEN);
    const e=k*k*(3-2*k);
    const ax=Math.sin(introT*.1)*20;
    camera.position.set(
      lerp(ax, 0, e), lerp(95, 8, e), lerp(-150, -34, e));
    camera.lookAt(lerp(0,0,e), lerp(10,2,e), lerp(90, -10, e));
    if(introT>INTRO_LEN) endIntro();
  }

  /* spelare */
  if(player && state.playing && !state.intro && !transitioning){
    const intent=inputManager.movement();
    let mx=intent.horizontal, mz=intent.forward;
    const l=Math.hypot(mx,mz);
    const run=speedMultiplier();
    player.moving=l>.15 && !panelEl;
    if(player.moving){
      mx/=l; mz/=l;
      const sp=3.1*run*Math.min(1,l*1.4);
      player.speed=sp;
      const wy=cam.yaw;
      // Camera-right is (-cos(yaw), 0, sin(yaw)); share it with touch input.
      const dx=(Math.sin(wy)*mz - Math.cos(wy)*mx)*sp*dt;
      const dz=(Math.cos(wy)*mz + Math.sin(wy)*mx)*sp*dt;
      movePlayer(dx,dz);
      const ta=Math.atan2(dx,dz);
      let da=ta-player.group.rotation.y;
      while(da>Math.PI)da-=Math.PI*2; while(da<-Math.PI)da+=Math.PI*2;
      player.group.rotation.y+=da*Math.min(1,dt*10);
      stepAcc+=sp*dt; if(stepAcc>1.1){ stepAcc=0; footstep(); }
    } else player.speed=0;
    player.waveT=Math.max(0,player.waveT-dt);
    animAvatar(player.group, dt, player.moving, player.speed, player.waveT);

    /* kamera följer */
    const p=player.group.position;
    const cy=cam.yaw, cp=cam.pitch, d=cam.dist;
    const tx=p.x - Math.sin(cy)*Math.cos(cp)*d;
    const tz=p.z - Math.cos(cy)*Math.cos(cp)*d;
    const ty=1.6 + Math.sin(cp)*d;
    camera.position.lerp(new THREE.Vector3(tx,ty,tz), Math.min(1,dt*7));
    camera.lookAt(p.x, 1.5, p.z);

    /* interaktioner: hitta närmsta */
    updateInteractions(p);

    /* ljudmix: pad stiger mot Stureplan / interiör */
    if(audio.padG){
      const target = state.inside ? .5 :
        Math.max(0, Math.min(1,(p.z-110)/70))*.42;
      audio.padG.gain.value += (target-audio.padG.gain.value)*dt*1.5;
    }
  }

  /* NPC:er */
  npcs.forEach(n=>{
    if(n.area!==(state.inside?urban.venue:'out')) return;
    if(urban.talking===n||(player&&dist2(n.g.position.x,n.g.position.z,player.group.position.x,player.group.position.z)<8)){
      n.g.rotation.y=Math.atan2(player.group.position.x-n.g.position.x,player.group.position.z-n.g.position.z);animAvatar(n.g,dt,false,0,0);return;
    }
    if(n.idle){ animAvatar(n.g, dt, false, 0, 0); return; }
    if(n.pauseT>0){ n.pauseT-=dt; animAvatar(n.g,dt,false,0,0); return; }
    const nz=n.g.position.z+n.dir*n.sp*dt;
    if(isNavigable(n.g.position.x,nz,n.area)) n.g.position.z=nz;else n.dir*=-1;
    n.g.rotation.y=n.dir>0?0:Math.PI;
    if(n.g.position.z>n.z1||n.g.position.z<n.z0){ n.dir*=-1;
      n.pauseT=1+Math.random()*3; }
    if(Math.random()<dt*.03) n.pauseT=1+Math.random()*2;
    animAvatar(n.g, dt, true, n.sp, 0);
  });
  demoNpcs.forEach(n=>{
    if(n.area!==(state.inside?urban.venue:'out')) return;
    if(urban.talking===n){animAvatar(n.g,dt,false,0,0);return;}
    n.waveT=Math.max(0,n.waveT-dt);
    n.wt-=dt;
    if(n.wt<0){ n.wt=4+Math.random()*5;
      n.tgt=[n.home[0]+(Math.random()-.5)*3, n.home[2]+(Math.random()-.5)*3]; }
    let moving=false;
    if(n.tgt){
      const dx=n.tgt[0]-n.g.position.x, dz=n.tgt[1]-n.g.position.z;
      const dl=Math.hypot(dx,dz);
      if(dl>.2){ moving=true;
        const nx=n.g.position.x+dx/dl*.6*dt,nz=n.g.position.z+dz/dl*.6*dt;
        if(isNavigable(nx,nz,n.area)){n.g.position.x=nx;n.g.position.z=nz;}else{n.tgt=null;moving=false;}
        n.g.rotation.y=Math.atan2(dx,dz); }
    }
    /* vänd sig mot spelaren när nära */
    if(player && dist2(n.g.position.x,n.g.position.z,player.group.position.x,player.group.position.z)<20){
      const dx=player.group.position.x-n.g.position.x, dz=player.group.position.z-n.g.position.z;
      const ta=Math.atan2(dx,dz); let da=ta-n.g.rotation.y;
      while(da>Math.PI)da-=Math.PI*2; while(da<-Math.PI)da+=Math.PI*2;
      n.g.rotation.y+=da*Math.min(1,dt*4); moving=false;
    }
    animAvatar(n.g, dt, moving, .6, n.waveT);
  });

  /* trafik */
  traffic.forEach(tr=>{
    if(state.inside) return;
    tr.p=(tr.p+dt*tr.sp/Math.abs(tr.to-tr.from))%1;
    const v=tr.from+(tr.to-tr.from)*tr.p;
    tr.m.position.set(v, 0, tr.at);
    tr.m.rotation.y=(tr.to>tr.from)?Math.PI/2:-Math.PI/2;
  });

  /* lyktflimmer + konst */
  lampGlows.forEach((g,i)=>{ g.material.opacity=.5+Math.sin(t*3+i*2.3)*.06; });
  if(t-urban.lastArtUpdate>1/12){artUpdaters.forEach(f=>f(t));urban.lastArtUpdate=t;}
  updateUrban(t);

  // Follow the player with a compact shadow frustum, snapped to shadow texels.
  moon.castShadow=!state.inside;
  if(!state.inside){
    const p=player?player.group.position:{x:0,z:-14};
    const texel=48/moon.shadow.mapSize.x;
    const x=Math.round(p.x/texel)*texel, z=Math.round(p.z/texel)*texel;
    moon.target.position.set(x,0,z); moon.position.set(x-40,80,z-30);
  }
  renderer.render(scene, camera);
}
function lerp(a,b,k){ return a+(b-a)*k; }

/* interaktionsdetektering */
let promptKey=null;
function updateInteractions(p){
  if(panelEl||transitioning){ if(promptKey){promptKey=null; hidePrompt();} return; }
  let best=null, bestD=1e9;
  const consider=(key,x,z,r,make)=>{ const d=dist2(p.x,p.z,x,z);
    if(d<r*r && d<bestD){ bestD=d; best={key,make}; } };
  collectUrbanInteractions(consider);
  if(!state.inside){
    consider('svamp',0,186,4.2,()=>showPrompt('Svampen — Stockholms mötesplats',
      [{label:'Se vilka som är här', fn:openSvampenPanel}]));
    consider('artw',-7,54,4.5,()=>showPrompt('GALLERI NOD · Verket lyssnar på din närvaro',
      [{label:'Betrakta', fn:()=>toast('Linjerna följer din puls — och lånar din accentfärg så länge du står kvar.')}]));
    demoNpcs.filter(n=>n.d.area==='out').forEach(n=>{
      const s=sig(n.d.signal);
      consider('npc_'+n.d.id, n.g.position.x, n.g.position.z, 3.4, ()=>showPrompt(
        `<b>${n.d.name}</b> <span class="badgeDemo">DEMO</span> · ${iconSVG(s.icon,s.color,13)} ${s.label}`,
        [{label:'Prata', fn:()=>talkTo(n)}, {label:'Vinka 👋', fn:()=>{waveAt(n); }},
         {label:'Profil', fn:()=>openProfileCard(n)}]));
    });
  } else if(urban.venue==='sture') {
    consider('studio',IN.cx-20,160,3.4,()=>showPrompt('Signalstudion — spegel, signaler, identitet',
      [{label:'Öppna studion', fn:()=>obStep1(true)}]));
    artFrames.forEach(f=>consider('art_'+f.art.id, f.x, f.z, 3.2,
      ()=>showPrompt(`<b>${f.art.title}</b> · ${f.art.tag}`,
        [{label:'Läs om verket', fn:()=>openArtCard(f)}])));
    demoNpcs.filter(n=>n.d.area==='in').forEach(n=>{
      const s=sig(n.d.signal);
      consider('npc_'+n.d.id, n.g.position.x, n.g.position.z, 3.4, ()=>showPrompt(
        `<b>${n.d.name}</b> <span class="badgeDemo">DEMO</span> · ${iconSVG(s.icon,s.color,13)} ${s.label}`,
        [{label:'Prata', fn:()=>talkTo(n)}, {label:'Vinka 👋', fn:()=>{waveAt(n);}},
         {label:'Profil', fn:()=>openProfileCard(n)}]));
    });
  }
  if(best){ if(best.key!==promptKey){ promptKey=best.key; best.make(); } }
  else if(promptKey){ promptKey=null; hidePrompt(); }
}

/* ---------- BOOT ---------- */
function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

/* första gest: starta ljud */
const gesture=()=>{ initAudio(); removeEventListener('pointerdown',gesture); removeEventListener('keydown',gesture); };
addEventListener('pointerdown',gesture); addEventListener('keydown',gesture);

setTimeout(()=>{ document.getElementById('fade').style.opacity=0; introEl.classList.add('show'); }, 300);
initUrban();
tick();
</script>
